name: Build portable app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/build-app
        with:
          os: windows
          arch: x64

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            python-arch: arm64
          - arch: x64
            python-arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-arch }}
      - uses: ./.github/actions/build-app
        with:
          os: macos
          arch: ${{ matrix.arch }}

  linux:
    runs-on: ubuntu-latest
    # `env` context is not available inside `container.image`, so the full
    # reference is hardcoded to the public quangngonz builder image.
    container:
      image: ghcr.io/quangngonz/easy-flash-builder:latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-app
        with:
          os: linux
          arch: x64

  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
